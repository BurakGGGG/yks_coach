<script>
        // Simple ambient pulse effect for the timer
        setInterval(() => {
            const glow = document.querySelector('.ambient-glow');
            if(glow) {
                const scale = 1 + Math.random() * 0.1;
                const opacity = 0.1 + Math.random() * 0.1;
                glow.style.transform = `translate(-50%, -50%) scale(${scale})`;
                glow.style.background = `radial-gradient(circle, rgba(37,99,235,${opacity}) 0%, rgba(255,255,255,0) 70%)`;
                glow.style.transition = 'all 2s ease-in-out';
            }
        }, 2000);
